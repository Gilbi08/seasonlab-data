name: Kursdaten aktualisieren

on:
  schedule:
    - cron: "25 2 * * *"      # täglich 02:25 UTC, nach Forex-, US- und Krypto-Tagesschluss
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fetch.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install --upgrade yfinance pandas
      - name: Kurse laden
        run: python fetch.py
      - name: Änderungen speichern
        run: |
          git config user.name "seasonlab-bot"
          git config user.email "seasonlab-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "Keine neuen Daten"
          else
            git commit -m "Kursdaten $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
